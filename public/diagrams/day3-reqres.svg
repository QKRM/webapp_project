<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-label="요청과 응답: 프론트가 POST /todos를 보내면 서버가 201 Created로 응답" font-family="system-ui, sans-serif">
  <style>
    .box  { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
    .title{ fill: #312e81; font-size: 16px; font-weight: 700; }
    .sub  { fill: #64748b; font-size: 12px; }
    .req  { fill: #6366f1; font-size: 13px; font-weight: 600; }
    .res  { fill: #16a34a; font-size: 13px; font-weight: 600; }
    .code { fill: #475569; font-size: 12px; font-family: ui-monospace, monospace; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e1b4b; stroke: #818cf8; }
      .title { fill: #e0e7ff; }
      .sub { fill: #94a3b8; }
      .code { fill: #94a3b8; }
      .res { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="rq" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="rs" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <rect class="box" x="30"  y="80" width="170" height="80" rx="10"/>
  <text class="title" x="115" y="115" text-anchor="middle">프론트엔드</text>
  <text class="sub"   x="115" y="138" text-anchor="middle">화면 (손님)</text>

  <rect class="box" x="500" y="80" width="170" height="80" rx="10"/>
  <text class="title" x="585" y="115" text-anchor="middle">백엔드 서버</text>
  <text class="sub"   x="585" y="138" text-anchor="middle">주방</text>

  <!-- request -->
  <line x1="205" y1="106" x2="495" y2="106" stroke="#6366f1" stroke-width="2" marker-end="url(#rq)"/>
  <text class="req"  x="350" y="56" text-anchor="middle">요청 ▶  POST /todos</text>
  <text class="code" x="350" y="98" text-anchor="middle">{ "title": "장보기" }</text>

  <!-- response -->
  <line x1="495" y1="138" x2="205" y2="138" stroke="#16a34a" stroke-width="2" marker-end="url(#rs)"/>
  <text class="res"  x="350" y="178" text-anchor="middle">◀ 응답  201 Created</text>
  <text class="code" x="350" y="208" text-anchor="middle">{ "id": 5, "title": "장보기", "is_done": false }</text>
</svg>
